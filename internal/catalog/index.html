<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge UI / Component Library</title>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/qdm0xrk.css" />
    <style>
      /* Consumer cascade: an application imports Tailwind before @bridge/ui/style.css, so package StyleX layers follow utilities. */
      @layer theme, base, components, utilities, priority1, priority2, priority3, priority4, priority5, priority6, priority7, priority8, priority9;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

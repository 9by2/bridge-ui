include:
  - project: "sellsuki/sre/deployment/pipeline-deployment"
    ref: "main"
    file: "templates/default.template.yml"
  - local: "/deployment/concurrency.gitlab-ci.yml"

default:
  tags: [docker, general, sellsuki, staging-th, amd]
  image: $CATALOG_IMAGE
  before_script:
    - bun install --frozen-lockfile
    - bun cmd/verify-ci-runtime.ts

variables:
  CATALOG_IMAGE: "$CI_REGISTRY_IMAGE/ci/catalog:playwright-1.63.0-bun-1.4.1-node-22.22.0"

stages:
  - verify
  - deploy

source:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
  script:
    - bun fmt --check
    - bun lint
    - bun typecheck
    - bun boundary
    - bun run build
    - bun test
    - bun coverage:brand
    - bun verify:package
    - bun verify:tree-shaking

coverage:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
  script:
    - bun coverage:runtime
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days

catalog:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
  script:
    - bun catalog:test
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
      - catalog-dist/
    expire_in: 7 days

release:
  stage: deploy
  resource_group: package-release
  variables:
    GIT_DEPTH: "0"
    INPUT_VERSION: bun release:version
    INPUT_PUBLISH: bun release:publish
    INPUT_TITLE: "Release @bridge/ui"
    INPUT_COMMIT: "chore: version package"
    INPUT_REMOVE_SOURCE_BRANCH: "true"
    INPUT_CREATE_GITLAB_RELEASES: "false"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - test -n "$GITLAB_TOKEN"
    - test "$(git ls-remote origin "refs/heads/$CI_DEFAULT_BRANCH" | cut -f1)" = "$CI_COMMIT_SHA" || { echo "Superseded pipeline; skip release"; exit 0; }
    - export GITLAB_HOST="$CI_SERVER_URL"
    - bunx changesets-gitlab
